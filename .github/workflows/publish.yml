name: Publish pyamares-xmris to PyPI

# Publishes the `pyamares-xmris` repackage when a v* tag is pushed.
#
# One-time setup required before this can work: add a "trusted publisher" entry in
# the PyPI project settings for `pyamares-xmris`, pointing at this repository, this
# workflow file (publish.yml), and the `pypi` environment below. No API token is
# stored anywhere -- authentication is via OIDC.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build sdist and wheel
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pyamares-xmris/
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        # pypa/gh-action-pypi-publish v1.14.1, pinned to a commit SHA
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247
