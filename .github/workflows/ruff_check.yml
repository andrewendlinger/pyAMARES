name: Ruff Check

on:
  workflow_call: # Make this workflow reusable
    inputs:
      python-version:
        description: 'Python version to use for Ruff checks'
        required: false
        default: '3.12'
        type: string

jobs:
  ruff_check:
    name: Run Ruff Lint & Format Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies (including Ruff)
        # Ruff is pinned to a minor series on purpose. An unpinned `pip install
        # ruff` once drifted ahead of every contributor's local version and
        # surfaced a rule (F507) that only CI could see. Bumping this pin is a
        # deliberate, reviewable change — reformat the tree in the same commit.
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'ruff==0.16.*'

      - name: Run Ruff linter check
        run: ruff check .

      - name: Run Ruff formatter check
        run: ruff format --check .
