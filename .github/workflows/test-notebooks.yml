name: Test Notebooks

on:
  workflow_call: # Make this workflow reusable
    inputs:
      python-versions:
        description: 'Python versions to test'
        required: false
        default: "['3.8', '3.9', '3.11', '3.12', '3.13', '3.14']"
        type: string

jobs:
  test-notebooks:
    name: Test with Python ${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(inputs.python-versions) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pytest nbval ipykernel
          python -m ipykernel install --user
          # The notebooks are the interactive workflow, so they need the extra
          # that D18 demoted them behind: step1_download.ipynb uses requests, and
          # the display path wants the Jupyter stack.
          python -m pip install -e ".[jupyter]"

      - name: Update notebook kernels
        run: |
          for nb in tests/*.ipynb; do
            sed -i 's/"kernel": "mrs"/"kernel": "python3"/g' $nb
            sed -i 's/"name": "mrs"/"name": "python3"/g' $nb
          done

      - name: Run notebook tests
        # Notebooks only: the numeric regression suite (tests/test_regression.py,
        # tests/test_api_surface.py) runs in its own workflow on pinned stacks —
        # its goldens are stack-sensitive and must not be judged by whatever this
        # job's unpinned resolution happens to install.
        run: pytest --nbval-lax --current-env tests/*.ipynb

      - name: Upload executed notebooks on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebooks-py${{ matrix.python-version }}
          path: tests/*_executed.ipynb
