name: Test Installation

on:
  workflow_call: # Make this workflow reusable
    inputs:
      python-versions:
        description: 'Python versions to test'
        required: false
        default: "['3.8', '3.10', '3.12', '3.13', '3.14']"
        type: string

jobs:
  build:
    name: Build distributions the way publish.yml does
    runs-on: ubuntu-latest
    # Mirrors the build half of publish.yml so a backend or metadata breakage
    # fails an ordinary PR instead of a pushed v* tag, which is irreversible.
    # This is the standing guard for D19's deferred PEP 639 migration: the
    # `license` table, `[tool.setuptools] license-files` and the BSD trove
    # classifier are all deprecated with removal announced for 2027-02-18, and
    # publish.yml resolves setuptools fresh at tag time. When the removal lands,
    # this job goes red first. Deliberately not solved by capping setuptools --
    # a cap would silently age the build environment instead of surfacing this.
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build sdist and wheel
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

  test:
    name: Test installation on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest] # Drop intel macOS unless needed
        python-version: ${{ fromJson(inputs.python-versions) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install .

      - name: Verify installation
        run: |
          python -c "import pyAMARES"

      - name: Verify the bare install is bare (D18)
        # Two claims, in order: nothing demoted to an extra came along for the
        # ride, and nothing that did get installed is loaded by a bare import
        # (D17). Both have to hold on a plain `pip install .` — the first is what
        # slimming means, the second is what makes it safe.
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util
          import sys

          demoted = "IPython ipykernel ipywidgets requests mat73 xlrd openpyxl hlsvdpro notebook".split()
          present = [n for n in demoted if importlib.util.find_spec(n) is not None]
          if present:
              sys.exit("bare install pulled in extras-only packages: %r" % present)
          print("no extras-only package installed:", demoted)

          import pyAMARES  # noqa: F401

          heavy = "matplotlib.pyplot nmrglue mat73 sympy IPython tqdm requests".split()
          loaded = [
              n for n in heavy
              if n in sys.modules or any(m.startswith(n + ".") for m in sys.modules)
          ]
          if loaded:
              sys.exit("bare `import pyAMARES` loaded %r (see DIVERGENCE.md D17)" % loaded)
          print("bare import loaded none of:", heavy)
          PY

  test-extras:
    name: Test the [jupyter] extra restores the pre-0.5.0 install
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.13']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install with the jupyter extra
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install ".[jupyter]"

      - name: Verify everything the extra promises imports
        run: |
          python -c "import pyAMARES, mat73, requests, IPython, ipykernel, ipywidgets, openpyxl, xlrd, notebook"
